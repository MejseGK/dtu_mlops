program: src/m6_project/train.py
name: sweepdemo
project: m6_project
entity: mejsegk-technical-university-of-denmark
method: random   # required: random | grid | bayes
metric:
    goal: minimize
    name: validation_loss
parameters:
    learning_rate:
        min: 0.0001
        max: 0.1
        distribution: log_uniform_values
    batch_size:
        values: [16, 32, 64]
    epochs:
        values: [5, 10, 15]
run_cap: 10